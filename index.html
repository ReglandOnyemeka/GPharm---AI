<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPharm AI Lagos — Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --green-deep: #0a4a3a; --green-mid: #166b54; --green-bright: #1e9070; --gold: #c8963c; --white: #fff; --border: #e0e6e2; --ai-purple: #8b5cf6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #faf9f6; color: #1a1c1a; line-height: 1.5; }
        
        nav { background: var(--white); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; color: var(--green-deep); cursor: pointer; }
        .nav-btn { background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .nav-btn.active { background: var(--green-deep); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .view { display: none; } .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ADMIN SUB-NAV */
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 12px; width: fit-content; }
        .admin-nav button { border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; background: transparent; }
        .admin-nav button.active { background: white; color: var(--green-deep); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* POS LAYOUT */
        .pos-container { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
        @media (max-width: 900px) { .pos-container { grid-template-columns: 1fr; } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.2rem; }
        .card { background: white; padding: 1.2rem; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); border-color: var(--green-mid); }
        
        .price { color: var(--gold); font-weight: 700; font-size: 1.3rem; margin-top: auto; }
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; margin-bottom: 8px; font-weight: 600; }
        .btn-primary { background: var(--green-deep); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; }

        /* CART & BILLING */
        .billing-card { background: white; padding: 1.5rem; border-radius: 16px; border: 2px solid var(--green-deep); position: sticky; top: 100px; }
        .payment-box { background: #f8fbf9; padding: 15px; border-radius: 10px; margin-top: 15px; }
        .pay-input { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pay-input input { width: 100px; padding: 5px; text-align: right; border-radius: 5px; border: 1px solid #ccc; }

        #public-cart-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--green-deep); color: white; width: 90%; max-width: 450px; padding: 1.2rem 2rem; border-radius: 50px; cursor: pointer; display: none; justify-content: space-between; align-items: center; z-index: 1001; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: var(--green-pale); padding: 12px; text-align: left; font-size: 0.8rem; color: var(--green-deep); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="window.location.reload()">GPharm <small style="color:var(--ai-purple); font-size: 0.6rem;">AI LAGOS</small></div>
    <div>
        <button class="nav-btn active" id="nav-btn-home" onclick="window.showView('home')">MyPharmacy</button>
        <button class="nav-btn" id="nav-btn-admin" onclick="window.handleLogin()">Pharmacy Login</button>
    </div>
</nav>

<!-- PATIENT STOREFRONT -->
<div id="view-home" class="view active">
    <div class="container">
        <div style="background:var(--green-deep); color:white; padding:3rem 1.5rem; border-radius:16px; text-align:center; margin-bottom:20px;">
            <h1>Lagos Premier Smart Pharmacy</h1>
            <p>Gemini AI Clinical Support • Real-time Cloud Sync • Doorstep Delivery</p>
        </div>
        <div id="ai-banner-public" class="ai-banner"><div id="ai-content-public"></div></div>
        <input type="text" id="input-search-public" placeholder="Search drug name or molecule (e.g. Lonart)..." style="width:100%; padding:15px; border-radius:30px; border:1px solid var(--border); margin-bottom:2rem; outline:none; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
        <div id="public-grid" class="grid"></div>
    </div>
</div>

<!-- STAFF PHARVENTORY -->
<div id="view-admin" class="view">
    <div class="container">
        <div class="admin-nav">
            <button id="admin-nav-pos" class="active" onclick="window.switchAdminTab('pos')">POS Terminal</button>
            <button id="admin-nav-inv" onclick="window.switchAdminTab('inv')">Inventory Manager</button>
        </div>

        <!-- POS SECTION -->
        <div id="admin-pos-view" class="admin-section">
            <div class="pos-container">
                <div>
                    <input type="text" placeholder="Scan or type drug..." onkeyup="window.renderPOS(this.value)" style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border);">
                    <div id="pos-grid" class="grid"></div>
                </div>
                <div class="billing-card">
                    <h3 style="color:var(--green-deep); margin-bottom:10px;">Billing</h3>
                    <div id="pos-cart-items" style="min-height:150px; font-size:0.85rem;"></div>
                    <div style="border-top:2px solid #eee; padding-top:10px; margin-top:10px;">
                        <div style="display:flex; justify-content:space-between; font-size:1.5rem; font-weight:800;">
                            <span>Total</span><span id="pos-total">₦0</span>
                        </div>
                        <div class="payment-box">
                            <div class="pay-input"><label>Cash</label><input type="number" id="pay-cash" value="0" oninput="window.validatePOS()"></div>
                            <div class="pay-input"><label>Transfer</label><input type="number" id="pay-transfer" value="0" oninput="window.validatePOS()"></div>
                            <div class="pay-input"><label>POS/Card</label><input type="number" id="pay-card" value="0" oninput="window.validatePOS()"></div>
                        </div>
                        <button class="btn-primary" id="btn-checkout-pos" onclick="window.checkoutPOS()" disabled style="opacity:0.5; margin-top:15px;">Complete Sale & SMS Receipt</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- INVENTORY SECTION -->
        <div id="admin-inv-view" class="admin-section" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Master Inventory</h2>
                <div style="display:flex; gap:10px;">
                    <input type="file" id="excel-file" style="display:none;" onchange="window.handleExcelUpload(this)">
                    <button class="nav-btn" onclick="document.getElementById('excel-file').click()">Bulk Import (Excel)</button>
                    <button class="nav-btn" style="background:var(--gold); color:white;" onclick="window.openAddModal()">+ Add Manually</button>
                </div>
            </div>
            <table>
                <thead><tr><th>Name</th><th>API</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead>
                <tbody id="inventory-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- FLOATING CART -->
<div id="public-cart-bar" onclick="window.openPublicCart()">
    <span style="font-weight:700;">🛒 Cart (<span id="cart-count">0</span>)</span>
    <span id="cart-sum" style="font-weight:700;">₦0</span>
</div>

<!-- MODALS -->
<div class="modal" id="modal-checkout">
    <div class="modal-content">
        <h2>Order Details</h2><br>
        <div id="modal-cart-list"></div><br>
        <div class="form-group"><label>Receiver Name</label><input type="text" id="order-name"></div>
        <div class="form-group"><label>Phone (11-Digits)</label><input type="tel" id="order-phone" maxlength="11"></div>
        <div class="form-group"><label>Lagos Address</label><input type="text" id="order-address"></div>
        <button class="btn-primary" onclick="window.checkoutPublic()">Confirm via WhatsApp</button>
        <button class="nav-btn" style="width:100%; margin-top:10px; border:none;" onclick="window.closeModal('modal-checkout')">Cancel</button>
    </div>
</div>

<div class="modal" id="modal-add">
    <div class="modal-content">
        <h2>Add Medication</h2><br>
        <input type="text" id="m-name" placeholder="Brand Name">
        <input type="text" id="m-api" placeholder="Active Ingredient (API)">
        <select id="m-cat"><option>Analgesics</option><option>Antibiotics</option><option>Antimalarials</option><option>Supplements</option></select>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <input type="number" id="m-price" placeholder="Price (₦)">
            <input type="number" id="m-stock" placeholder="Stock Qty">
        </div>
        <label><input type="checkbox" id="m-pom"> Prescription Required</label><br><br>
        <button class="btn-primary" onclick="window.saveManualProduct()">Save to Cloud</button>
        <button class="nav-btn" style="width:100%; margin-top:10px; border:none;" onclick="window.closeModal('modal-add')">Cancel</button>
    </div>
</div>

<footer>
    <p>&copy; <span id="footer-year">2024</span> GPharm Lagos &bull; Verified Smart Pharmacy System</p>
</footer>

<script src="app.js"></script>
</body>
</html>
