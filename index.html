<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPharm Smart Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --green-deep: #0a4a3a; --gold: #c8963c; --white: #fff; --border: #e0e6e2; --ai-purple: #8b5cf6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #faf9f6; color: #1a1c1a; line-height: 1.5; }
        nav { background: var(--white); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; color: var(--green-deep); }
        .nav-btn { background: none; border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; color: var(--green-deep); }
        .nav-btn.active { background: var(--green-deep) !important; color: #ffffff !important; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .view { display: none; } .view.active { display: block; }
        .hero { background: var(--green-deep); color: white; padding: 3rem 1.5rem; border-radius: 16px; text-align: center; margin-bottom: 2rem; }
        #input-search-public { width: 100%; padding: 1rem; border-radius: 50px; border: 1px solid var(--border); margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .card { background: white; padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); }
        .price { color: var(--gold); font-weight: 700; font-size: 1.3rem; }
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 8px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-primary { background: var(--green-deep); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 700; }
        .ai-banner { background: #f5f3ff; border: 1px solid var(--ai-purple); padding: 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; border-radius: 12px; overflow: hidden; }
        th { text-align: left; padding: 12px; background: #f0f7f2; color: var(--green-deep); font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 500px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">GPharm <small style="color:var(--gold); font-size: 0.6rem;">AI</small></div>
    <div>
        <button onclick="window.showView('home')" id="nav-btn-home" class="nav-btn active">MyPharmacy</button>
        <button onclick="window.handleLogin()" id="nav-btn-admin" class="nav-btn">Pharmacy Login</button>
    </div>
</nav>

<div id="view-home" class="view active">
    <div class="container">
        <div class="hero"><h1>Smart Pharmacy</h1><p>Genuine Medicine &bull; Clinical AI Support</p></div>
        <input type="text" id="input-search-public" placeholder="Search brands or ingredients...">
        <div id="public-grid" class="grid"></div>
    </div>
</div>

<div id="view-admin" class="view">
    <div class="container">
        <div id="insights-panel" style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div style="background:white; padding:1.2rem; border-radius:12px; border:1px solid #ddd;"><label>VALUE</label><div id="stat-total" style="font-size:1.5rem; font-weight:700;">₦0</div></div>
            <div style="background:white; padding:1.2rem; border-radius:12px; border:1px solid #ddd;"><label>LOW STOCK</label><div id="stat-low" style="font-size:1.5rem; font-weight:700; color:red;">0</div></div>
        </div>
        <div id="ai-banner-admin" class="ai-banner"><div id="ai-content-admin"></div></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
            <h2>Cloud Inventory</h2>
            <button class="nav-btn" style="background:var(--gold); color:white; border:none;" onclick="window.openAddModal()">+ Add Item</button>
        </div>
        <div id="admin-grid" class="grid"></div>
        <br>
        <table><thead><tr><th>Name</th><th>API</th><th>Price</th><th>Stock</th></tr></thead><tbody id="inventory-tbody"></tbody></table>
    </div>
</div>

<div class="modal" id="modal-add">
    <div class="modal-content">
        <h2>Manual Entry</h2><br>
        <input type="text" id="m-name" placeholder="Brand Name" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="m-api" placeholder="Active Ingredient" style="width:100%; padding:10px; margin-bottom:10px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <input type="number" id="m-price" placeholder="Price (₦)" style="padding:10px;">
            <input type="number" id="m-stock" placeholder="Quantity" style="padding:10px;">
        </div>
        <input type="text" id="m-cat" value="General" style="display:none;">
        <br><label><input type="checkbox" id="m-pom"> Prescription Required</label><br><br>
        <button class="btn-primary" onclick="window.saveManualProduct()">Save to Cloud</button>
        <button class="nav-btn" style="width:100%; margin-top:10px; border:none;" onclick="window.closeModal('modal-add')">Cancel</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
